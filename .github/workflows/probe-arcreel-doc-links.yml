name: probe-arcreel-doc-links

on:
  push:
    paths:
      - '.github/workflows/probe-arcreel-doc-links.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every candidate URL
        run: |
          set +e
          URLS=(
            "https://platform.vidu.cn/docs/function-list"
            "https://platform.vidu.cn/docs/overview/function-list.md"
            "https://platform.vidu.cn/docs/overview/model-map.md"
            "https://platform.vidu.cn/docs/pricing"
            "https://platform.vidu.cn/docs"
            "https://github.com/AgnesAI-Labs/AgnesAI-Models/blob/main/MODEL_CATALOG.md"
            "https://wiki.agnes-ai.com/en/docs/pricing.md"
            "https://wiki.agnes-ai.com/en/docs"
            "https://api.minimax.cn"
            "https://api.minimaxi.com/v1"
          )
          for u in "${URLS[@]}"; do
            echo "=============================================================="
            echo "URL: $u"
            body=$(mktemp)
            code=$(curl -sSL --max-time 45 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -o "$body" -w '%{http_code}' "$u" 2>/dev/null)
            final=$(curl -sSL --max-time 45 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -o /dev/null -w '%{url_effective}' "$u" 2>/dev/null)
            size=$(wc -c < "$body")
            echo "http_code: $code"
            echo "final_url: $final"
            echo "bytes: $size"
            echo "--- text head (tags stripped) ---"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' "$body" \
              | tr -s ' \n' ' \n' | grep -v '^[[:space:]]*$' | head -c 700
            echo ""
            echo "--- grep markers ---"
            grep -oiE "文档未找到|not found|404|page not found|model-map|function-list|pricing|agnes-video-v2.0|agnes-2.5-pro|agnes-3.0-flash|agnes-image-2.5-flash" "$body" | sort | uniq -c | head -20
          done
          echo "=============================================================="
          echo "DONE"
