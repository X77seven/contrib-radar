name: probe-minio-sources

on:
  push:
    paths:
      - '.github/workflows/probe-minio-sources.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner environment
        run: |
          echo "runner: $RUNNER_OS"
          docker version --format 'server={{.Server.Version}}' || echo "no docker"

      - name: Real docker pull per candidate
        run: |
          set +e
          IMAGES=(
            "quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z"
            "quay.io/minio/aistor/minio:latest"
            "chrislusf/seaweedfs:4.47"
            "chrislusf/seaweedfs:latest"
            "pgsty/silo:RELEASE.2026-09-03T13-18-01Z"
            "pgsty/silo:latest"
            "redis:7-alpine"
          )
          echo "=== REAL DOCKER PULL (replacement candidates) ==="
          printf "%-52s | %-6s | %s\n" "IMAGE" "RESULT" "DETAIL"
          for img in "${IMAGES[@]}"; do
            out=$(docker pull "$img" 2>&1)
            if [ $? -eq 0 ]; then
              printf "%-52s | %-6s | %s\n" "$img" "OK" "pulled successfully"
            else
              d=$(printf '%s' "$out" | grep -iEo "unauthorized|access denied|denied|too many requests|manifest unknown|not found|rate limit|no such manifest" | head -1)
              if [ -z "$d" ]; then d=$(printf '%s' "$out" | tail -1 | cut -c1-60); fi
              printf "%-52s | %-6s | %s\n" "$img" "FAIL" "$d"
            fi
          done

      - name: Registry API exact HTTP status
        run: |
          ACC="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          probe() {
            local host="$1" repo="$2" ref="$3"
            local hdr realm service token code
            hdr=$(curl -sS -D - -o /dev/null "https://$host/v2/" 2>/dev/null | tr -d '\r' | grep -i '^www-authenticate:' || true)
            realm=$(printf '%s' "$hdr" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            service=$(printf '%s' "$hdr" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
            if [ -z "$realm" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Accept: $ACC" "https://$host/v2/$repo/manifests/$ref")
            else
              token=$(curl -sS "$realm?service=$service&scope=repository:$repo:pull" | jq -r '.token // .access_token')
              code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H "Accept: $ACC" "https://$host/v2/$repo/manifests/$ref")
            fi
            printf "%-52s | HTTP %s\n" "$host/$repo:$ref" "$code"
          }
          echo "=== REGISTRY API (anonymous, with OAuth2 handshake) ==="
          probe quay.io minio/minio latest
          probe quay.io minio/aistor/minio latest
          probe quay.io minio/aistor/minio RELEASE.2026-09-19T17-05-25Z
          probe registry-1.docker.io chrislusf/seaweedfs latest
          probe registry-1.docker.io pgsty/silo latest
          probe registry-1.docker.io minio/minio latest
          probe registry-1.docker.io redis 7-alpine
